name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the artifact (e.g. v0.1.0-dev). Used when run manually; tag pushes use the tag name.'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan 2
        run: pip install "conan>=2.0"

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('*/*/conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Conan profile detect
        run: conan profile detect --force

      - name: Build every shipped game and stage install/
        run: python build.py --install

      - name: Verify every staged game carries its translation
        run: |
          $games = Get-ChildItem -Directory install
          if ($games.Count -eq 0) { throw "install/ is empty" }
          foreach ($g in $games) {
            $plain = Join-Path $g.FullName 'script_output\translated_text.json'
            $enc = "$plain.enc"
            if (Test-Path $enc) {
              if (Test-Path $plain) {
                throw "$($g.Name): translated_text.json is staged beside the .enc -- the plain text would ship"
              }
              $file = $enc; $form = 'encrypted'
              foreach ($n in 'decrypt_translations.bat', 'translations_key.txt') {
                if (-not (Test-Path (Join-Path $g.FullName $n))) {
                  throw "$($g.Name): translation is encrypted but $n is not staged"
                }
              }
            } elseif (Test-Path $plain) {
              $file = $plain; $form = 'plain'
            } else {
              throw "$($g.Name): no translated_text.json or .json.enc staged"
            }
            $mb = [math]::Round((Get-Item $file).Length / 1MB, 1)
            Write-Host "$($g.Name): translation $mb MB ($form)"
          }
        shell: pwsh

      - name: Resolve version label
        id: ver
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Zip install/
        run: |
          Compress-Archive `
            -Path install\* `
            -DestinationPath vn-translate-${{ steps.ver.outputs.VERSION }}-windows.zip
        shell: pwsh

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: vn-translate-${{ steps.ver.outputs.VERSION }}-windows
          path: vn-translate-${{ steps.ver.outputs.VERSION }}-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vn-translate-${{ steps.ver.outputs.VERSION }}-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
