name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the artifact (e.g. v0.1.0-dev). Used when run manually; tag pushes use the tag name.'
        required: true
        default: 'v0.0.0-dev'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Conan 2
        run: pip install "conan>=2.0"

      - uses: seanmiddleditch/gha-setup-ninja@v5

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('*/*/conanfile.py') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Conan profile detect
        run: conan profile detect --force

      - name: Build, test, and stage every shipped game
        run: python build.py --test --install

      - name: Verify every staged game carries its translation
        run: |
          $games = Get-ChildItem -Directory install
          if ($games.Count -eq 0) { throw "install/ is empty" }
          foreach ($g in $games) {
            $plain = Join-Path $g.Name 'script_output\translated_text.json'
            if (-not (Test-Path $plain) -or (Get-Item $plain).Length -le 0) {
              throw "$($g.Name): missing or empty source script_output/translated_text.json"
            }
            $stagedScriptOut = Join-Path $g.FullName 'script_output'
            if (Test-Path $stagedScriptOut) {
              throw "$($g.Name): script_output directory must not be staged in release: $stagedScriptOut"
            }
            $leaked = Get-ChildItem -Path $g.FullName -Recurse -Include '*.json','*.enc','decrypt_translations.bat','encrypt_translations.bat','translations_key.txt' -File -ErrorAction SilentlyContinue
            if ($leaked) {
              throw "$($g.Name): raw script, .enc, or key helper leaked into staged release: $($leaked.FullName -join ', ')"
            }
            $mb = [math]::Round((Get-Item $plain).Length / 1MB, 1)
            $gameDir = Join-Path $g.FullName 'game'
            if ($g.Name -eq 'EXTRAVAGANZA_01_CE') {
              $patchBin = Join-Path $gameDir 'extravaganza_patch.bin'
              if (-not (Test-Path $patchBin) -or (Get-Item $patchBin).Length -le 0) {
                throw "$($g.Name): missing or empty game/extravaganza_patch.bin"
              }
              $patchMb = [math]::Round((Get-Item $patchBin).Length / 1MB, 1)
              Write-Host "$($g.Name): source translation $mb MB, extravaganza_patch.bin ($patchMb MB)"
            } elseif ($g.Name -eq 'kishin_hisho') {
              foreach ($req in @('0script.pak', 'alpharom_helper.dll', 'launch.exe')) {
                $reqPath = Join-Path $gameDir $req
                if (-not (Test-Path $reqPath) -or (Get-Item $reqPath).Length -le 0) {
                  throw "$($g.Name): missing or empty game/$req"
                }
              }
              $nps = Get-ChildItem -Path (Join-Path $gameDir 'script') -Filter '*.nps' -File -ErrorAction SilentlyContinue
              if (-not $nps -or $nps.Count -lt 119) {
                throw "$($g.Name): expected at least 119 .nps files in game/script/, found $($nps.Count)"
              }
              $recon = Join-Path $g.Name 'script_output\nps_reconstruction_map.json'
              if (-not (Test-Path $recon) -or (Get-Item $recon).Length -le 0) {
                throw "$($g.Name): missing or empty source script_output/nps_reconstruction_map.json"
              }
              $pakItem = Get-Item (Join-Path $gameDir '0script.pak')
              if ($pakItem.LastWriteTimeUtc -lt (Get-Item $plain).LastWriteTimeUtc) {
                throw "$($g.Name): game/0script.pak is older than script_output/translated_text.json"
              }
              $pakMb = [math]::Round($pakItem.Length / 1MB, 2)
              Write-Host "$($g.Name): source translation $mb MB, 0script.pak ($pakMb MB), $($nps.Count) .nps scripts"
            } else {
              $tsv = Get-ChildItem -Path $gameDir -Filter '*.tsv' -File -ErrorAction SilentlyContinue
              if (-not $tsv -or $tsv[0].Length -eq 0) {
                throw "$($g.Name): no runtime .tsv table staged in game/"
              }
              $tsvMb = [math]::Round($tsv[0].Length / 1MB, 1)
              if ($g.Name -eq 'FRATERNITE_HD') {
                $patchBin = Join-Path $gameDir 'cgsys_patch.bin'
                if (-not (Test-Path $patchBin) -or (Get-Item $patchBin).Length -le 0) {
                  throw "$($g.Name): missing or empty game/cgsys_patch.bin"
                }
                $patchMb = [math]::Round((Get-Item $patchBin).Length / 1MB, 1)
                Write-Host "$($g.Name): source translation $mb MB, runtime table $($tsv[0].Name) ($tsvMb MB), cgsys_patch.bin ($patchMb MB)"
              } elseif ($g.Name -in @('shingakkou', 'EXTRAVAGANZA_02_MUSHIGURUI_HD10', 'EXTRAVAGANZA_03_MATSURO_CE', 'EXTRAVAGANZA_04_AGEHA_CE', 'EXTRAVAGANZA_05_ANZU_CE', 'EXTRAVAGANZA_06_YUMEMI_CE', 'EXTRAVAGANZA_07_REN_MUSHI_CE', 'EXTRAVAGANZA_08_MIZUNA_CE')) {
                $patchBin = Join-Path $gameDir 'menu_patch.bin'
                if (-not (Test-Path $patchBin) -or (Get-Item $patchBin).Length -le 0) {
                  throw "$($g.Name): missing or empty game/menu_patch.bin"
                }
                $patchMb = [math]::Round((Get-Item $patchBin).Length / 1MB, 1)
                Write-Host "$($g.Name): source translation $mb MB, runtime table $($tsv[0].Name) ($tsvMb MB), menu_patch.bin ($patchMb MB)"
              } else {
                Write-Host "$($g.Name): source translation $mb MB, runtime table $($tsv[0].Name) ($tsvMb MB)"
              }
            }
          }
        shell: pwsh

      - name: Resolve version label
        id: ver
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            echo "VERSION=${{ github.event.inputs.version }}" >> $env:GITHUB_OUTPUT
          } else {
            echo "VERSION=${{ github.ref_name }}" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Zip install/
        run: |
          Compress-Archive `
            -Path install\* `
            -DestinationPath vn-translate-${{ steps.ver.outputs.VERSION }}-windows.zip
        shell: pwsh

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: vn-translate-${{ steps.ver.outputs.VERSION }}-windows
          path: vn-translate-${{ steps.ver.outputs.VERSION }}-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vn-translate-${{ steps.ver.outputs.VERSION }}-windows.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
